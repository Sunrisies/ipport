[package]
name = "ipport"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Inspect local TCP and UDP ports from the CLI or a local web dashboard"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
netstat2 = "0.11"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system", "user"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

