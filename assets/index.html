<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>ipport · 本机端口</title>
  <style>
    :root{color-scheme:light;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18263a;background:#f5f7fa;font-size:14px;--muted:#65738a;--line:#dfe6ee;--accent:#087f5b}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .shell{max-width:1300px;margin:auto;padding:30px 40px 50px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:25px}.brand{font-weight:750;font-size:23px;letter-spacing:-1px;display:flex;gap:12px;align-items:center}.logo{border:1px solid #bdd9cd;border-radius:10px;color:var(--accent);font-size:17px;padding:8px;letter-spacing:-2px}.local{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:8px}.dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
    .intro{margin:42px 0 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;font-weight:600}h1{font-size:34px;letter-spacing:-1px;margin:12px 0}p{color:var(--muted);line-height:1.7;margin:0}.refresh{background:var(--accent);color:#ffffff;border:0;border-radius:7px;padding:12px 20px;font-weight:650;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}.stat{border:1px solid var(--line);background:#ffffff;border-radius:9px;padding:21px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:30px;letter-spacing:-1px;margin-top:10px;font-variant-numeric:tabular-nums}.stat-value small{font-size:12px;letter-spacing:0;color:var(--muted);margin-left:8px}
    .panel{background:#ffffff;border:1px solid var(--line);border-radius:10px;overflow:hidden}.toolbar{display:flex;gap:12px;align-items:center;padding:18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.search{position:relative;flex:1;min-width:200px}.search span{position:absolute;top:11px;left:13px;color:var(--muted)}input[type=search]{width:100%;padding:11px 12px 11px 35px}input,select{background:#f8fafc;border:1px solid var(--line);border-radius:6px;color:#18263a;padding:10px}input::placeholder{color:#6b778a}.toggle{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted)}.toggle input{accent-color:var(--accent)}
    .meta{display:flex;justify-content:space-between;gap:15px;padding:14px 20px;color:var(--muted);font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;letter-spacing:.5px;color:var(--muted);font-weight:500;padding:13px 20px;background:#f6f8fb;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}td{padding:17px 20px;border-bottom:1px solid #e8edf3;font-size:13px}.mono{font-family:"SFMono-Regular",Consolas,monospace}.port{color:#18263a;font-weight:600;font-size:16px}.badge{display:inline-block;font-size:10px;font-weight:600;padding:4px 7px;border-radius:4px;letter-spacing:.5px;background:#e7f2fd;color:#215f96}.badge.udp{background:#eee8fa;color:#7048a7}.state{color:var(--accent);font-size:11px;display:inline-flex;align-items:center;gap:6px}.state.other{color:#9b650e}.address{color:#53647b}.sub{color:var(--muted);font-size:11px;margin-top:4px}.detail{background:transparent;color:var(--accent);border:1px solid #bdd9cd;border-radius:5px;padding:6px 10px;font-size:12px}.empty{text-align:center;color:var(--muted);padding:50px 20px}.notice{color:#9b650e;padding:13px 20px;border-top:1px solid var(--line);font-size:12px;line-height:1.7}.error{margin-bottom:18px;border:1px solid #fecdd3;background:#fff1f2;border-radius:7px;color:#b42335;padding:14px;line-height:1.7}footer{display:flex;justify-content:space-between;gap:20px;margin-top:22px;font-size:11px;color:var(--muted);line-height:1.7}
    dialog{background:#ffffff;border:1px solid #dfe6ee;color:#18263a;border-radius:12px;max-width:650px;width:calc(100% - 32px);padding:28px}dialog::backdrop{background:#24324859;backdrop-filter:blur(4px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}h2{font-size:23px;margin:0}.close{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);padding:7px 11px}.facts{display:grid;grid-template-columns:100px 1fr;gap:14px 20px;margin:0}.facts dt{color:var(--muted);font-size:12px}.facts dd{margin:0;overflow-wrap:anywhere}.process{margin-top:20px;border-top:1px solid var(--line);padding-top:20px}.process-title{font-weight:600;margin-bottom:14px}
    .refresh:hover{background:#076c4e}.detail:hover{background:#edf8f2}.close:hover{background:#f1f5f9}tbody tr:hover{background:#fafcfe}
    @media(max-width:760px){.shell{padding:20px 16px}.intro{margin-top:30px;align-items:flex-start}h1{font-size:27px}.intro p{font-size:12px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:16px}.toolbar{padding:14px}.search{flex-basis:100%}.local{font-size:10px}.meta{font-size:10px}th,td{padding:13px}footer{display:block}footer span{display:block;margin-bottom:8px}.facts{grid-template-columns:75px 1fr;gap:12px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div class="brand"><span class="logo" aria-hidden="true">&gt;_</span>ipport</div><div class="local"><span class="dot"></span>LOCAL MACHINE <span id="platform"></span></div></header>
    <section class="intro"><div><div class="eyebrow">NETWORK EXPLORER</div><h1>看清本机的每一个端口。</h1><p>查看端口状态、监听地址，以及它背后的进程。</p></div><button class="refresh" id="refresh">↻ 刷新端口</button></section>
    <div id="error" class="error" role="alert" hidden></div>
    <section class="stats" aria-label="端口统计">
      <div class="stat"><div class="stat-label">当前范围 · 端口数</div><div class="stat-value" id="total">—</div></div>
      <div class="stat"><div class="stat-label">TCP 监听</div><div class="stat-value" id="tcp">—<small>LISTENING</small></div></div>
      <div class="stat"><div class="stat-label">UDP 绑定</div><div class="stat-value" id="udp">—<small>BOUND</small></div></div>
      <div class="stat"><div class="stat-label">关联进程</div><div class="stat-value" id="processes">—<small>PROCESSES</small></div></div>
    </section>
    <section class="panel" aria-label="端口列表">
      <div class="toolbar">
        <div class="search"><span aria-hidden="true">⌕</span><input type="search" id="search" aria-label="搜索端口或进程" placeholder="搜索端口、进程、PID 或地址…"></div>
        <select id="protocol" aria-label="协议"><option value="">全部协议</option><option value="tcp">TCP</option><option value="udp">UDP</option></select>
        <label class="toggle"><input type="checkbox" id="all">包含全部 TCP 连接</label>
        <label class="toggle"><input type="checkbox" id="auto">每 5 秒刷新</label>
      </div>
      <div class="meta"><span id="count" aria-live="polite">正在读取本机端口…</span><span id="updated">尚未刷新</span></div>
      <div class="table-wrap"><table><thead><tr><th>端口</th><th>协议</th><th>状态</th><th>本地地址</th><th>进程</th><th>PID</th><th><span aria-label="操作">详情</span></th></tr></thead><tbody id="rows"><tr><td colspan="7" class="empty">正在读取…</td></tr></tbody></table></div>
      <div id="warnings" class="notice" hidden></div>
    </section>
    <footer><span>仅展示当前权限可读取的信息；部分系统进程可能不可见。</span><span>通配地址表示绑定全部接口，实际可访问性取决于防火墙。UDP 无监听状态。</span></footer>
  </main>
  <dialog id="dialog" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title">端口详情</h2><button class="close" id="close">关闭 ✕</button></div><div id="detail-body"></div></dialog>
  <script>
    const $ = id => document.getElementById(id);
    let ports = [], visible = [], busy = false, queued = false;
    const labels = {loopback:'仅本机回环',all_interfaces:'全部网络接口',interface:'指定网络接口'};
    // Always construct text nodes: process names and paths are untrusted OS data.
    function node(tag, text, className) { const el=document.createElement(tag); if(text!==undefined)el.textContent=text; if(className)el.className=className; return el; }
    function render() {
      const search=$('search').value.trim().toLowerCase(), protocol=$('protocol').value;
      visible=ports.filter(p => (!protocol || p.protocol===protocol) && [p.local_port,p.local_endpoint,p.remote_endpoint,p.state,...p.processes.flatMap(x=>[x.name,x.pid,x.executable,x.user])].join(' ').toLowerCase().includes(search));
      const rows=$('rows');rows.replaceChildren();
      $('count').textContent=`${visible.length} 个 Socket · 点击详情查看地址和进程信息`;
      if(!visible.length){const tr=node('tr'),td=node('td','没有符合条件的端口','empty');td.colSpan=7;tr.append(td);rows.append(tr);}
      visible.forEach(p=>{
        const tr=node('tr');
        const port=node('td',String(p.local_port),'port mono');tr.append(port);
        const protocolCell=node('td');protocolCell.append(node('span',p.protocol.toUpperCase(),`badge ${p.protocol}`));tr.append(protocolCell);
        const state=node('td');state.append(node('span',p.state,`state ${['LISTEN','BOUND'].includes(p.state)?'':'other'}`));tr.append(state);
        const address=node('td');address.append(node('div',p.local_endpoint,'mono address'),node('div',`${p.family} · ${labels[p.exposure]}`,'sub'));tr.append(address);
        tr.append(node('td',p.processes.map(x=>x.name||'未知进程').join(', ')||'无法读取'));
        tr.append(node('td',p.processes.map(x=>x.pid).join(', ')||'—','mono address'));
        const action=node('td'),button=node('button','查看 ↗','detail');button.addEventListener('click',()=>show(p));action.append(button);tr.append(action);rows.append(tr);
      });
      const selected=ports.filter(p=>!protocol||p.protocol===protocol);
      $('total').textContent=new Set(selected.map(p=>p.local_port)).size;
      $('tcp').replaceChildren(node('span',String(selected.filter(p=>p.protocol==='tcp'&&p.state==='LISTEN').length)),node('small','SOCKETS'));
      $('udp').replaceChildren(node('span',String(selected.filter(p=>p.protocol==='udp').length)),node('small','SOCKETS'));
      $('processes').replaceChildren(node('span',String(new Set(selected.flatMap(p=>p.processes.map(x=>x.pid))).size)),node('small','PROCESSES'));
    }
    function facts(entries) {const dl=node('dl',undefined,'facts');entries.forEach(([label,value])=>dl.append(node('dt',label),node('dd',value??'无法读取','mono')));return dl;}
    function show(p) {
      $('detail-title').textContent=`${p.protocol.toUpperCase()} :${p.local_port}`;
      const body=$('detail-body');body.replaceChildren(facts([['本地地址',p.local_endpoint],['远端地址',p.remote_endpoint||'—'],['协议',`${p.protocol.toUpperCase()} / ${p.family}`],['状态',p.state],['绑定范围',labels[p.exposure]]]));
      if(!p.processes.length)body.append(node('p','操作系统未提供所属进程信息。','process'));
      p.processes.forEach(process=>{const section=node('section',undefined,'process');section.append(node('div',process.name||'未知进程','process-title'),facts([['PID',String(process.pid)],['用户',process.user],['可执行文件',process.executable]]));body.append(section);});
      $('dialog').showModal();
    }
    async function refresh() {
      if(busy){queued=true;return;}busy=true;$('refresh').disabled=true;$('refresh').textContent='读取中…';
      const query=new URLSearchParams({all:String($('all').checked)});
      try {
        const response=await fetch(`/api/ports?${query}`,{cache:'no-store',signal:AbortSignal.timeout(15000)});
        if(!response.ok){const message=await response.text();let parsed;try{parsed=JSON.parse(message);}catch{}throw new Error(parsed?.error||message||`HTTP ${response.status}`);}
        const data=await response.json();ports=data.ports;render();$('error').hidden=true;
        $('platform').textContent=`/ ${data.platform.toUpperCase()}`;
        $('updated').textContent=`${new Date(data.scanned_at_ms).toLocaleTimeString()} 更新 · ${data.elapsed_ms} ms`;
        $('warnings').hidden=!data.warnings.length;$('warnings').textContent=data.warnings.length?'部分 Socket 或进程详情无法读取，结果可能不完整。可能由于权限限制或进程已退出。':'';
      }catch(error){$('error').textContent=`读取失败：${error.message}。${ports.length?'下方保留上次成功读取的结果。':'请确认本地服务正在运行。'}`;$('error').hidden=false;$('count').textContent='读取失败 · 结果尚未更新';if(!ports.length){const tr=node('tr'),td=node('td','暂时无法获取端口，请重试。','empty');td.colSpan=7;tr.append(td);$('rows').replaceChildren(tr);}}
      finally{busy=false;$('refresh').disabled=false;$('refresh').textContent='↻ 刷新端口';if(queued){queued=false;refresh();}}
    }
    $('refresh').addEventListener('click',refresh);$('search').addEventListener('input',render);$('protocol').addEventListener('change',render);$('all').addEventListener('change',refresh);
    $('close').addEventListener('click',()=>$('dialog').close());
    setInterval(()=>{if($('auto').checked&&!document.hidden)refresh();},5000);
    refresh();
  </script>
</body>
</html>
